name: Build

on:
    push:
        branches: ["main"]
        tags: ["v*"]
    pull_request:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            # web-ext is pinned in package.json, so CI runs the same version as
            # a local build rather than whatever npx resolves to that day.
            - name: Install
              run: |
                  corepack enable
                  pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm exec web-ext lint --source-dir=.

            - name: Build
              run: pnpm exec web-ext build --source-dir=. --artifacts-dir=dist --overwrite-dest --filename unmetered_for_nyt.zip

            # The package is uploaded to AMO, so a stray .github or node_modules
            # would ship to users. Fail here rather than in review.
            - name: Verify package contents
              run: |
                  unzip -l dist/unmetered_for_nyt.zip
                  ! unzip -l dist/unmetered_for_nyt.zip | grep -qE "node_modules|\.github|pnpm-lock|README"
                  unzip -l dist/unmetered_for_nyt.zip | grep -q "LICENSE"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: unmetered_for_nyt
                  path: dist/unmetered_for_nyt.zip

            - name: Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/unmetered_for_nyt.zip
