<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Unmetered for NYT</title>
  <style>
    :root {
      --serif: Georgia, 'Times New Roman', Times, serif;
      --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --rule: #e2e2e2;
      --muted: #6b6b6b;
    }

    * { box-sizing: border-box; }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #fff;
      color: #000;
      font-family: var(--sans);
      border: 1px solid #000;
    }

    .masthead {
      text-align: center;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .masthead h1 {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin: 0;
    }

    .date {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    .label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-top: 1px solid #000;
      display: inline-block;
      padding-top: 4px;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    #status-text {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 700;
    }

    #status-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    #toggle-button {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 16px;
      border: 1px solid var(--rule);
      background: #fff;
      color: #000;
      cursor: pointer;
    }

    #toggle-button:hover { background: var(--rule); }

    #toggle-button.active {
      background: #000;
      color: #fff;
      border-color: #000;
    }

    #toggle-button.active:hover { background: #333; }

    #toggle-button:focus-visible { outline: 2px solid #2196F3; outline-offset: 2px; }

    footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px solid var(--rule);
      text-align: center;
      font-size: 10px;
      line-height: 1.5;
      color: var(--muted);
    }

    footer a { color: var(--muted); }
  </style>
</head>

<body>
  <div class="masthead">
    <h1 data-i18n="popupTitle">Unmetered for NYT</h1>
    <div class="date" id="current-date"></div>
  </div>

  <div class="label" data-i18n="statusLabel">Status</div>
  <div class="row">
    <div>
      <div id="status-text" data-i18n="statusActive">Protection Active</div>
      <div id="status-sub" data-i18n="statusSub">Reading without limits</div>
    </div>
    <button id="toggle-button" class="active" type="button" data-i18n="btnOn">ON</button>
  </div>

  <footer>
    <span data-i18n="footerFree">Free, unmetered, and open source.</span><br>
    <a href="welcome.html" id="note-link" data-i18n="footerNote">Why this fork exists</a>
  </footer>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
